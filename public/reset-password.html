<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — KODEVEX</title><link rel="stylesheet" href="/styles.css"></head>
<body class="auth-page"><div class="auth-wrap"><div class="auth-brand"><img src="/assets/kodevex-logo.png" alt=""><h1>Set a new password.</h1><p>Your reset link is time-limited for security.</p></div><div class="auth-card"><form id="reset" class="auth-form"><label>New password<input type="password" name="password" minlength="8" required></label><label>Confirm password<input type="password" name="confirm" minlength="8" required></label><button class="btn primary full">Update Password</button><a class="text-btn" href="/login.html">Back to login</a></form><div id="msg" class="form-msg"></div></div></div>
<script>
const form=document.querySelector('#reset'),msg=document.querySelector('#msg'),token=new URLSearchParams(location.search).get('token');
form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form);if(f.get('password')!==f.get('confirm')){msg.textContent='Passwords do not match.';return;}const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:f.get('password')})});const d=await r.json();msg.textContent=d.message||d.error||'';if(r.ok)setTimeout(()=>location.href='/login.html',1200);}
</script></body></html>
